<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- file-organizer icon. Palette from the LTT colored logo; sibling of the video-frame-triage icon. -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="#182e54"/>
  <!-- three sorted folders, one tab color per file type -->
  <g>
    <rect x="22" y="58" width="30" height="16" rx="4" fill="#a6a5a4"/>
    <rect x="22" y="68" width="64" height="62" rx="6" fill="#dbdee9"/>
    <rect x="31" y="84" width="46" height="7" rx="3" fill="#a6a5a4"/>
    <rect x="31" y="98" width="34" height="7" rx="3" fill="#a6a5a4"/>
    <rect x="31" y="112" width="40" height="7" rx="3" fill="#a6a5a4"/>
  </g>
  <g>
    <rect x="96" y="58" width="30" height="16" rx="4" fill="#6c7fb7"/>
    <rect x="96" y="68" width="64" height="62" rx="6" fill="#dbdee9"/>
    <rect x="105" y="84" width="46" height="7" rx="3" fill="#6c7fb7"/>
    <rect x="105" y="98" width="34" height="7" rx="3" fill="#6c7fb7"/>
    <rect x="105" y="112" width="40" height="7" rx="3" fill="#6c7fb7"/>
  </g>
  <g>
    <rect x="170" y="58" width="30" height="16" rx="4" fill="#dbdee9"/>
    <rect x="170" y="68" width="64" height="62" rx="6" fill="#dbdee9"/>
  </g>
  <!-- magnifying glass over the third folder, as in the LTT logo -->
  <line x1="214" y1="196" x2="228" y2="216" stroke="#dbdee9" stroke-width="22" stroke-linecap="round"/>
  <circle cx="186" cy="158" r="50" fill="#2f4b9c" stroke="#dbdee9" stroke-width="14"/>
  <!-- a document under the lens -->
  <path d="M166 130 L196 130 L208 142 L208 186 L166 186 Z" fill="#dbdee9"/>
  <path d="M196 130 L196 142 L208 142 Z" fill="#a6a5a4"/>
  <g fill="#2f4b9c">
    <rect x="173" y="150" width="28" height="5" rx="2"/>
    <rect x="173" y="161" width="22" height="5" rx="2"/>
    <rect x="173" y="172" width="26" height="5" rx="2"/>
  </g>
</svg>
